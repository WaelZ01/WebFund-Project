<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Technical CV and project portfolio illustration">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2430"/>
      <stop offset="100%" stop-color="#273344"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0d131a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" rx="24" fill="url(#bgGrad)"/>
  <circle cx="110" cy="90" r="140" fill="#B8C0FF" opacity="0.06"/>
  <circle cx="700" cy="460" r="180" fill="#8A94A6" opacity="0.08"/>

  <!-- Main CV Document Card -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="55" width="370" height="430" rx="16" fill="#EEF1F5"/>
    <!-- Header banner of CV -->
    <rect x="90" y="55" width="370" height="92" rx="16" fill="#273344"/>
    <rect x="90" y="125" width="370" height="22" fill="#273344"/>
    <!-- Avatar circle -->
    <circle cx="148" cy="101" r="28" fill="#B8C0FF"/>
    <circle cx="148" cy="93" r="10" fill="#1B2430"/>
    <path d="M130 118 C130 106, 166 106, 166 118" fill="#1B2430"/>
    <!-- Name & role bars -->
    <rect x="192" y="84" width="160" height="14" rx="7" fill="#EEF1F5"/>
    <rect x="192" y="106" width="110" height="10" rx="5" fill="#B8C0FF"/>

    <!-- Section 1: Technical Skills -->
    <rect x="120" y="172" width="110" height="10" rx="5" fill="#1B2430"/>
    <rect x="120" y="194" width="76" height="22" rx="6" fill="#B8C0FF"/>
    <rect x="204" y="194" width="90" height="22" rx="6" fill="#DFE4EC"/>
    <rect x="302" y="194" width="68" height="22" rx="6" fill="#B8C0FF"/>
    <rect x="378" y="194" width="52" height="22" rx="6" fill="#DFE4EC"/>

    <!-- Section 2: Projects & Labs -->
    <rect x="120" y="240" width="130" height="10" rx="5" fill="#1B2430"/>
    <rect x="120" y="262" width="310" height="58" rx="10" fill="#FFFFFF" stroke="#8A94A6" stroke-width="1.5"/>
    <circle cx="142" cy="291" r="10" fill="#B8C0FF"/>
    <rect x="162" y="276" width="150" height="9" rx="4.5" fill="#1B2430"/>
    <rect x="162" y="293" width="245" height="7" rx="3.5" fill="#8A94A6"/>
    <rect x="162" y="305" width="190" height="7" rx="3.5" fill="#8A94A6"/>

    <rect x="120" y="332" width="310" height="58" rx="10" fill="#FFFFFF" stroke="#8A94A6" stroke-width="1.5"/>
    <circle cx="142" cy="361" r="10" fill="#8A94A6"/>
    <rect x="162" y="346" width="175" height="9" rx="4.5" fill="#1B2430"/>
    <rect x="162" y="363" width="235" height="7" rx="3.5" fill="#8A94A6"/>
    <rect x="162" y="375" width="160" height="7" rx="3.5" fill="#8A94A6"/>

    <!-- Section 3: Education & Certs -->
    <rect x="120" y="412" width="95" height="10" rx="5" fill="#1B2430"/>
    <rect x="120" y="432" width="260" height="8" rx="4" fill="#8A94A6"/>
    <rect x="120" y="448" width="210" height="8" rx="4" fill="#8A94A6"/>
  </g>

  <!-- Floating Portfolio / Code Card (Top Right) -->
  <g filter="url(#cardShadow)">
    <rect x="420" y="85" width="295" height="175" rx="16" fill="#1B2430" stroke="#B8C0FF" stroke-width="2.5"/>
    <!-- Window dots -->
    <circle cx="445" cy="110" r="5" fill="#B8C0FF"/>
    <circle cx="462" cy="110" r="5" fill="#8A94A6"/>
    <circle cx="479" cy="110" r="5" fill="#EEF1F5"/>
    <!-- Code brackets & bars -->
    <path d="M460 155 L442 170 L460 185" fill="none" stroke="#B8C0FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M500 155 L518 170 L500 185" fill="none" stroke="#B8C0FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="486" y1="150" x2="474" y2="190" stroke="#8A94A6" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="538" y="152" width="145" height="10" rx="5" fill="#EEF1F5"/>
    <rect x="538" y="170" width="115" height="8" rx="4" fill="#8A94A6"/>
    <rect x="538" y="186" width="90" height="8" rx="4" fill="#B8C0FF"/>
    <rect x="442" y="218" width="240" height="18" rx="9" fill="#273344"/>
    <rect x="442" y="218" width="185" height="18" rx="9" fill="#B8C0FF"/>
  </g>

  <!-- Floating Certification & Verification Badge Card (Bottom Right) -->
  <g filter="url(#cardShadow)">
    <rect x="445" y="295" width="270" height="155" rx="16" fill="#EEF1F5" stroke="#B8C0FF" stroke-width="2"/>
    <!-- Shield / Checkmark Badge -->
    <circle cx="502" cy="372" r="34" fill="#B8C0FF"/>
    <path d="M487 372 L498 383 L520 360" fill="none" stroke="#1B2430" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Badge text bars -->
    <rect x="552" y="344" width="135" height="12" rx="6" fill="#1B2430"/>
    <rect x="552" y="366" width="115" height="9" rx="4.5" fill="#8A94A6"/>
    <rect x="552" y="384" width="95" height="9" rx="4.5" fill="#8A94A6"/>
    <rect x="552" y="405" width="76" height="18" rx="6" fill="#1B2430"/>
  </g>
</svg>
